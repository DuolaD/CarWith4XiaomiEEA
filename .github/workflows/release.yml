name: Build module on release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and upload, e.g. v0.3"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Compute version
        id: ver
        run: |
          set -eu
          # versionCode from the numeric part of the tag: v1.2.3 -> 10203, v0.3 -> 300
          nums=$(echo "$TAG" | sed -E 's/^[^0-9]*//; s/[^0-9.].*$//')
          IFS=. read -r major minor patch _ <<< "$nums" || true
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          if [ -z "$nums" ] || [ "$code" -le 0 ]; then
            # Tag has no usable number: fall back to commit count
            code=$(git rev-list --count HEAD)
          fi
          echo "Tag: $TAG  versionCode: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "zip=CarWith4XiaomiEEA-$TAG.zip" >> "$GITHUB_OUTPUT"

      - name: Stamp module.prop
        run: |
          set -eu
          sed -i "s|^version=.*|version=$TAG|" module/module.prop
          sed -i "s|^versionCode=.*|versionCode=${{ steps.ver.outputs.code }}|" module/module.prop
          cat module/module.prop

      - name: Package module
        run: |
          set -eu
          mkdir -p out
          cd module
          zip -qr -X "../out/${{ steps.ver.outputs.zip }}" . \
            -x "*.DS_Store" -x ".bootcount" -x "status.txt" -x "guard.log" -x "disable"
          cd ..
          unzip -l "out/${{ steps.ver.outputs.zip }}"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "out/${{ steps.ver.outputs.zip }}" --clobber --repo "$GITHUB_REPOSITORY"
